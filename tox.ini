[tox]
isolated_build = True
envlist =
    py{310,311,312}-django{42},
    py{310,311,312,313,314}-django{52}

[testenv]
setenv =
    PYTHONWARNINGS = error::DeprecationWarning,error::PendingDeprecationWarning
commands = python -m coverage run --parallel -m pytest {posargs:tests}
deps =
    -r requirements/{envname}.txt
commands_pre =
    sh -c 'python -m pip install --upgrade --no-deps -r "https://raw.githubusercontent.com/DLRSP/requirements/main/$(echo {envname} | cut -d- -f1)-dev.txt"'
    sh -c 'curl -fsSL https://raw.githubusercontent.com/DLRSP/workflows/main/.github/actions/compile-locale-catalogs/compile_locale_catalogs.py | python -'

# python3-openid imports deprecated defusedxml.cElementTree; keep Werror on 4.2 only.
[testenv:py{310,311,312,313,314}-django52]
setenv =
    PYTHONWARNINGS = default
